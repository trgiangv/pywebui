<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pythonnet OOB bridge test</title>
  <style>
    body { font-family: Consolas, monospace; margin: 16px; background: #111; color: #eee; }
    button { margin: 4px 8px 4px 0; padding: 8px 12px; }
    #out { white-space: pre-wrap; border: 1px solid #444; padding: 12px; min-height: 200px; }

<body>
  <h1>pythonnet OOB — no Revit</h1>
